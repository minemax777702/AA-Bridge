name: HU diagnostics APK
on:
  workflow_dispatch:
  push:
    branches: [feat/hu-diagnostics-apk]
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/hu-diagnostics.yml"
      - "tools/**"
concurrency:
  group: hu-diagnostics-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: python3 -m unittest discover -s tools -p 'test_*hu*.py'
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Install required SDK platform/build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;36.0.0"
      - name: Verify Gradle Wrapper
        run: echo "498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - run: chmod +x gradlew && ./gradlew :app:assembleDiagnostics --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: AA-Bridge-Diagnostics
          path: app/build/outputs/apk/diagnostics/*.apk
          if-no-files-found: error
