name: HU diagnostics APK
on:
  workflow_dispatch:
  push:
    branches: [feat/hu-diagnostics-apk]
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/hu-diagnostics.yml"
      - "tools/**"
concurrency:
  group: hu-diagnostics-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: python3 -m unittest discover -s tools -p 'test_decode_hu_dump.py'
      - run: sdkmanager "platforms;android-34"
      - run: chmod +x gradlew && ./gradlew :app:assembleDiagnostics
      - uses: actions/upload-artifact@v4
        with:
          name: AA-Bridge-Diagnostics
          path: app/build/outputs/apk/diagnostics/*.apk
          if-no-files-found: error
