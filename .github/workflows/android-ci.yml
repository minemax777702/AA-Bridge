name: Android CI
# Auto-labels each run in the Actions list instead of a generic "Android
# CI" repeated for every single run: a PR build names itself after the PR
# (number + title), anything else after the branch and short commit.
run-name: >-
  ${{ github.event_name == 'pull_request'
    && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
    || format('{0} @ {1}', github.ref_name, github.sha) }}

on:
  push:
    branches: [main, 'security/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install required SDK platform/build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AndroidAuto-Bridge-debug.apk
          cd dist
          sha256sum AndroidAuto-Bridge-debug.apk > SHA256SUMS.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: AndroidAuto-Bridge-debug-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
