name: Android CI
# Auto-labels each run in the Actions list instead of a generic "Android
# CI" repeated for every single run: a PR build names itself after the PR
# (number + title), anything else after the branch and short commit.
run-name: >-
  ${{ github.event_name == 'pull_request'
    && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
    || format('{0} @ {1}', github.ref_name, github.sha) }}

on:
  push:
    branches: [main, 'security/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install required SDK platform/build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Verify Gradle Wrapper
        run: echo "498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug testDebugUnitTest --no-daemon 2>&1 | tee "audit/build-attempt-${attempt}.log"; then
              exit 0
            fi
            if ! grep -Eiq 'status code 429|HTTP[ /]+429|Too Many Requests' "audit/build-attempt-${attempt}.log"; then
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            delay=$((60 * attempt))
            echo "::warning::Repository rate limit; retrying in ${delay}s"
            sleep "$delay"
          done
          exit 1

      - name: Export resolved dependency inventory
        run: |
          mkdir -p audit
          ./gradlew -I ci/dependency-audit.init.gradle securityDependencyInventory --no-daemon

      - name: Audit dependencies against OSV
        run: python3 ci/osv-audit.py

      - name: Antivirus scan of APK and extracted contents
        if: ${{ !cancelled() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != '' }}
        run: |
          set -euo pipefail
          mkdir -p audit
          test -f app/build/outputs/apk/debug/app-debug.apk
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --stdout
          scan_dir="$(mktemp -d)"
          unzip -q app/build/outputs/apk/debug/app-debug.apk -d "$scan_dir"
          clamscan --version | tee audit/clamav.txt
          clamscan --recursive --infected --max-filesize=100M --max-scansize=400M app/build/outputs/apk/debug/app-debug.apk "$scan_dir" | tee -a audit/clamav.txt

      - name: Verify APK signature and manifest
        if: ${{ !cancelled() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != '' }}
        run: |
          set -euo pipefail
          mkdir -p audit
          tools="$ANDROID_HOME/build-tools/34.0.0"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee audit/apk-signature.txt
          "$tools/aapt" dump permissions "$apk" | tee audit/apk-permissions.txt
          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' audit/apk-permissions.txt; then exit 1; fi

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-${{ github.run_number }}
          path: audit/
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AndroidAuto-Bridge-debug.apk
          cd dist
          sha256sum AndroidAuto-Bridge-debug.apk > SHA256SUMS.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: AndroidAuto-Bridge-debug-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
