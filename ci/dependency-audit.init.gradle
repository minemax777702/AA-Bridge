import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import groovy.json.JsonOutput

gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.register('securityDependencyInventory') {
        doLast {
            def inventory = [:]
            def collect = { configuration, scope ->
                if (configuration == null || !configuration.canBeResolved) return
                def result = configuration.incoming.resolutionResult
                result.allDependencies.each { dep ->
                    if (dep instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult) {
                        throw new GradleException("Unresolved dependency in " + scope + ": " + dep.attempted)
                    }
                }
                result.allComponents.each { component ->
                    if (component.id instanceof ModuleComponentIdentifier) {
                        def id = component.id
                        def key = "${id.group}:${id.module}:${id.version}"
                        if (!inventory.containsKey(key)) {
                            inventory[key] = [name: "${id.group}:${id.module}".toString(), version: id.version, scopes: []]
                        }
                        inventory[key].scopes.add(scope)
                    }
                }
            }
            root.allprojects.each { project ->
                project.configurations.findAll { it.canBeResolved &&
                    (it.name.endsWith('RuntimeClasspath') || it.name.endsWith('CompileClasspath'))
                }.each { cfg -> collect(cfg, project.path + ':' + cfg.name) }
                collect(project.buildscript.configurations.findByName('classpath'), project.path + ':buildscript')
            }
            if (inventory.isEmpty()) throw new GradleException('Empty dependency inventory')
            def output = root.file('audit/dependencies.json')
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(inventory.values().toList()))
            println "Inventoried ${inventory.size()} Maven coordinates"
        }
    }
}
